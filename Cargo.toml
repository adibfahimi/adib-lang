[package]
name = "adib-lang"
version = "0.2.0"
edition = "2021"
authors = ["Adib Fahimi <adibfahi@gmail.com>"]
description = "A small tree-walking interpreter for a JavaScript-flavored language"
license = "MIT"
readme = "README.md"
repository = "https://github.com/adibfahimi/adib-lang"
homepage = "https://github.com/adibfahimi/adib-lang"
keywords = ["interpreter", "language", "programming-language", "tree-walking"]
categories = ["compilers", "parser-implementations"]

[dependencies]
phf = { version = "0.11.2", features = ["macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.92"

[lib]
crate-type = ["cdylib", "rlib"]
